<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Squid Rush</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      /* No page scroll, pinch-zoom or text selection while playing. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
    }
    /* Landscape only: in a portrait window this covers the game (which pauses) and asks to
       turn the device. */
    #rotate {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background: linear-gradient(#028bac, #003f51);
      color: #fff;
      font: 800 22px/1.3 system-ui, -apple-system, sans-serif;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      -webkit-text-stroke: 0;
      z-index: 10;
    }
    #rotate-text { max-width: 14em; }
    #rotate svg {
      width: 96px;
      height: 96px;
      animation: turn 2.4s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 25% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) {
      #rotate { display: flex; }
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ddd;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- The game: build/squidGame.riv, signed (rive . --publish, see build.sh) and copied next to
       this page as squidGame.riv. Serve the folder over http; opening the file straight from
       disk won't load the .riv. -->
  <canvas id="game" tabindex="0"></canvas>
  <div id="error">The game couldn't load.</div>
  <div id="rotate" aria-live="polite">
    <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">
      <rect x="18" y="6" width="28" height="52" rx="6"/>
      <line x1="28" y1="50" x2="36" y2="50" stroke-linecap="round"/>
    </svg>
    <div id="rotate-text">Rotate your device to play</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2/rive.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const RIV_VERSION = '1790875898'; // set by build.sh

    const r = new rive.Rive({
      // build.sh stamps a new version on every build, so the browser fetches the new file
      // instead of a cached one.
      src: 'squidGame.riv?v=' + RIV_VERSION,
      canvas,
      artboard: 'Artboard',
      stateMachines: 'State Machine 1',
      autoplay: true,
      autoBind: true,
      // Lets the CREDITS buttons' url event open be.net/danilofiocco in a new tab.
      automaticallyHandleEvents: true,
      // 1920x1080 artboard, letterboxed to fit any window.
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => {
        fitCanvas();
        const vm = r.viewModelInstance;
        if (vm) {
          // The game shows Brazilian Portuguese when the system is in Portuguese, else English.
          const lang = vm.string('systemLanguage');
          if (lang) lang.value = navigator.language || 'en';
          // The mouse wheel scrolls the ranking list (in artboard px).
          const wheel = vm.number('rankingWheel');
          if (wheel) {
            canvas.addEventListener('wheel', (e) => {
              e.preventDefault();
              const px = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
              wheel.value += px * 1.5;
            }, { passive: false });
          }
        }
        if (vm) setupKeyboard(vm);
        if (vm) setupLeaderboard(vm);
        canvas.focus();
      },
      onLoadError: (e) => {
        console.error(e);
        document.getElementById('error').style.display = 'flex';
      },
    });

    // ---- Leaderboard ----------------------------------------------------------------------
    // Shared by everyone: the squid_scores table in Supabase (see LEADERBOARD.md). The
    // publishable key is meant to be public; the table's policies only allow reading and adding.
    const LEADERBOARD = {
      url: 'https://wkhfpujnynwflcimngjg.supabase.co',
      key: 'sb_publishable_KJAWjztbbgQqlC6IYCYS4g_eeuVSd1z',
      table: 'squid_scores',
    };
    const LIST_MAX = 100; // rows the ranking shows
    const NAME_MAX = 12;  // matches the game and the table's check
    const SCORE_MAX = 100000;

    function setupLeaderboard(vm) {
      const data = vm.string('rankingData');
      const highlight = vm.number('rankHighlight');
      const submitted = vm.trigger('scoreSubmitted');
      if (!data || !highlight || !submitted) return;
      const base = `${LEADERBOARD.url}/rest/v1/${LEADERBOARD.table}`;
      const headers = { apikey: LEADERBOARD.key, Authorization: `Bearer ${LEADERBOARD.key}` };
      const clean = (name) => String(name).replace(/[\t\n]/g, ' ').trim().slice(0, NAME_MAX);

      // The list goes to the game as "NAME<tab>SHELLS" lines, best first (ties: earliest first,
      // as the game itself orders them); `mine` is the id of the row to light up.
      function show(rows, mine) {
        data.value = rows.map((r) => `${clean(r.name)}\t${r.score}`).join('\n');
        const at = rows.findIndex((r) => r.id === mine);
        highlight.value = at >= 0 ? at + 1 : 0;
      }
      function load() {
        return fetch(`${base}?select=id,name,score&order=score.desc,id.asc&limit=${LIST_MAX}`, { headers })
          .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); });
      }
      load().then((rows) => show(rows, -1)).catch((e) => console.error('leaderboard', e));

      // The game added the player's name to its own list already; save it for everyone, then
      // show the shared list with their row lit. (Offline, the game's own list just stays.)
      submitted.on(() => {
        const name = clean(vm.string('submittedName').value);
        const score = Math.round(vm.number('submittedScore').value);
        if (!name || score < 0 || score > SCORE_MAX) return;
        fetch(base, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': 'application/json', Prefer: 'return=representation' },
          body: JSON.stringify({ name, score }),
        })
          .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
          .then((created) => load().then((rows) => show(rows, created[0] && created[0].id)))
          .catch((e) => console.error('leaderboard', e));
      });
    }

    // The keyboard: the web runtime doesn't hand keys to the game's script, so the page does.
    // Each press goes into `hostKeys` as "k<TAB>down|up<TAB>code<TAB>shift" (GLFW key codes, as
    // the game expects), and each typed character as "t<TAB>char" (for names, accents and all);
    // the game drains the queue every frame. `hostKeyboard` tells it to ignore the runtime's own
    // key events so nothing arrives twice.
    function setupKeyboard(vm) {
      const queue = vm.string('hostKeys');
      const flag = vm.number('hostKeyboard');
      if (!queue || !flag) return;
      flag.value = 1;
      const NAMED = { Space: 32, Enter: 257, NumpadEnter: 335, Backspace: 259, Escape: 256,
        Minus: 45, Period: 46 };
      const codeOf = (e) => {
        if (/^Key[A-Z]$/.test(e.code)) return e.code.charCodeAt(3);
        if (/^Digit[0-9]$/.test(e.code)) return e.code.charCodeAt(5);
        return NAMED[e.code] || 0;
      };
      const push = (line) => { queue.value = queue.value ? queue.value + '\n' + line : line; };
      const onKey = (phase) => (e) => {
        if (e.metaKey || e.ctrlKey) return; // leave browser shortcuts alone
        const code = codeOf(e);
        if (code) push(['k', phase, code, e.shiftKey ? 1 : 0].join('\t'));
        if (phase === 'down' && e.key.length === 1 && e.key !== '\t') push('t\t' + e.key);
        if (code === 32 || code === 259) e.preventDefault(); // no page scroll / back
      };
      window.addEventListener('keydown', onKey('down'));
      window.addEventListener('keyup', onKey('up'));
    }

    // iPhones mute web audio while the ring/silent switch is on silent; ask for a "playback"
    // session (like a video) where Safari supports it.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';

    // Keep the game's drawing surface (and so its tap positions) matched to the canvas
    // whenever the canvas changes size.
    //  - Resolution: drawn at most ~2200 device pixels across (about the artboard's own 1920),
    //    not the full Retina 2-3x - most of the frame time went into those extra pixels.
    //  - Responsive: the artboard (1920x1080) is fitted whole; on wider or taller windows the
    //    game is told which part of artboard space is visible, so its screens reach the edges.
    const ARTBOARD_W = 1920, ARTBOARD_H = 1080;
    // Quality tiers (see adaptive quality below): how many device pixels across the game is
    // drawn at, and whether the extras (light rays, caustics, shell glow) are left out.
    const TIERS = [
      { maxW: 2200, low: 0 },
      { maxW: 1600, low: 0 },
      { maxW: 1280, low: 1 },
      { maxW: 960, low: 1 },
    ];
    let tier = 0;
    const fitCanvas = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      const maxW = TIERS[tier].maxW;
      // (at the lower tiers this may go below 1 CSS pixel per pixel: softer, but much cheaper)
      const dpr = Math.min(window.devicePixelRatio || 1, tier === 0 ? Math.max(1, maxW / w) : maxW / w);
      r.resizeDrawingSurfaceToCanvas(dpr);
      const vm = r.viewModelInstance;
      if (!vm) return;
      const scale = Math.min(w / ARTBOARD_W, h / ARTBOARD_H);
      const visW = w / scale, visH = h / scale;
      const set = (name, v) => { const p = vm.number(name); if (p) p.value = v; };
      set('viewL', (ARTBOARD_W - visW) / 2);
      set('viewR', (ARTBOARD_W + visW) / 2);
      set('viewT', (ARTBOARD_H - visH) / 2);
      set('viewB', (ARTBOARD_H + visH) / 2);
      set('lowQuality', TIERS[tier].low);
    };

    // ---- Adaptive quality -------------------------------------------------------------------
    // Watches the frame rate in 2-second windows; when a device can't keep up (under 48 fps), it
    // steps down a tier: fewer pixels first, then the extras off as well. It never steps back
    // up (that would flicker), and it stops when a step doesn't help - a phone capped at 30 fps
    // (iPhone Low Power Mode) shouldn't be pushed to the lowest quality for nothing.
    // ?quality=0..3 in the address forces a tier, for testing.
    const forced = new URLSearchParams(location.search).get('quality');
    if (forced !== null) tier = Math.max(0, Math.min(TIERS.length - 1, parseInt(forced, 10) || 0));
    (function watchFrameRate() {
      const WINDOW = 2000, TARGET = 48, SETTLE = 3000;
      let frames = 0, start = 0, skipUntil = performance.now() + 4000, lastFps = 0;
      const reset = (now, settle) => { frames = 0; start = now; skipUntil = now + settle; };
      document.addEventListener('visibilitychange', () => reset(performance.now(), 1000));
      function tick(now) {
        requestAnimationFrame(tick);
        if (forced !== null || document.hidden || r.isPaused) { reset(now, 1000); return; }
        if (now < skipUntil) { start = now; frames = 0; return; }
        frames++;
        if (now - start < WINDOW) return;
        const fps = frames * 1000 / (now - start);
        reset(now, 0);
        if (fps >= TARGET || tier >= TIERS.length - 1) return;
        if (lastFps && fps < lastFps + 3) return; // the last step didn't help: leave it
        lastFps = fps;
        tier++;
        fitCanvas();
        reset(now, SETTLE);
        console.info('Squid Rush: ' + fps.toFixed(0) + ' fps, quality tier ' + tier);
      }
      requestAnimationFrame(tick);
    })();
    if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', fitCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
    window.addEventListener('pageshow', fitCanvas);

    // Keys (space to swim, typing a name, S sound, L language) go to the game while the
    // canvas has focus.
    canvas.addEventListener('pointerdown', () => canvas.focus());

    // ---- Landscape only ---------------------------------------------------------------------
    // Browsers can't force the screen round (iPhones don't allow it at all), so in portrait the
    // #rotate cover asks for it and the game pauses (sound too) until the device turns. Where
    // the browser allows it (Android), the first tap also goes fullscreen and locks landscape.
    if ((navigator.language || '').toLowerCase().startsWith('pt')) {
      document.getElementById('rotate-text').textContent = 'Gire o aparelho para jogar';
    }
    const portrait = window.matchMedia('(orientation: portrait)');
    const applyOrientation = () => {
      if (portrait.matches) r.pause();
      else { r.play(); fitCanvas(); }
    };
    if (portrait.addEventListener) portrait.addEventListener('change', applyOrientation);
    else portrait.addListener(applyOrientation);
    r.on(rive.EventType.Load, applyOrientation);
    const lockLandscape = () => {
      document.removeEventListener('pointerdown', lockLandscape, true);
      const el = document.documentElement;
      const touch = window.matchMedia('(pointer: coarse)').matches;
      if (!touch || !el.requestFullscreen || !screen.orientation || !screen.orientation.lock) return;
      el.requestFullscreen({ navigationUI: 'hide' })
        .then(() => screen.orientation.lock('landscape'))
        .catch(() => {}); // not allowed here: the rotate cover still does the job
    };
    document.addEventListener('pointerdown', lockLandscape, true);
  </script>
</body>
</html>
